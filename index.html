<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRIENDLY MEET</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f3fa;color:#252442}
header{background:#5546d8;color:white;text-align:center;padding:25px}
header h1{margin:0;font-size:30px}
header p{margin-bottom:0}
main{max-width:600px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 3px 15px #0001}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{background:#5546d8;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:bold;cursor:pointer;margin:5px 0}
button:hover{background:#4032b7}
.switch{text-align:center;color:#5546d8;cursor:pointer}
.hidden{display:none}
.post{border-bottom:1px solid #eee;padding:15px 0}
small{color:#777}
</style>
</head>
<body>

<header>
<h1>FRIENDLY MEET</h1>
<p>Meet new people. Make friends. Share moments.</p>
</header>

<main>

<section class="card" id="signup">
<h2>Create Your Account</h2>
<p>Join the FRIENDLY MEET community.</p>
<input id="newName" placeholder="Your full name">
<input id="newEmail" type="email" placeholder="Your email address">
<input id="newPassword" type="password" placeholder="Create a password">
<button onclick="register()">Sign Up</button>
<p class="switch" onclick="showLogin()">Already have an account? Log in</p>
</section>

<section class="card hidden" id="login">
<h2>Welcome Back!</h2>
<input id="loginEmail" type="email" placeholder="Your email address">
<input id="loginPassword" type="password" placeholder="Your password">
<button onclick="login()">Log In</button>
<p class="switch" onclick="showSignup()">Create a new account</p>
</section>

<section class="hidden" id="community">
<div class="card">
<h2 id="welcome"></h2>
<p>You're part of FRIENDLY MEET!</p>
<button onclick="logout()">Log Out</button>
</div>

<div class="card">
<h2>Share a Moment</h2>
<textarea id="postText" placeholder="What's happening?"></textarea>
<button onclick="addPost()">Share Post</button>
</div>

<div class="card">
<h2>Community Feed</h2>
<div id="feed">Welcome to our community!</div>
</div>
</section>

</main>

<script>
function showLogin(){
document.getElementById("signup").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
}

function showSignup(){
document.getElementById("login").classList.add("hidden");
document.getElementById("signup").classList.remove("hidden");
}

function register(){
const name=document.getElementById("newName").value.trim();
const email=document.getElementById("newEmail").value.trim();
const password=document.getElementById("newPassword").value;

if(!name||!email||!password){
alert("Please fill in all the fields.");
return;
}

alert("Registration screen working! Real account creation will be connected next.");
}

function login(){
alert("Login screen working! Secure account login will be connected next.");
}

function logout(){
document.getElementById("community").classList.add("hidden");
document.getElementById("signup").classList.remove("hidden");
}

function addPost(){
const text=document.getElementById("postText").value.trim();
if(!text){alert("Write something first!");return;}

const post=document.createElement("p");
post.className="post";
post.textContent=text;
document.getElementById("feed").prepend(post);
document.getElementById("postText").value="";
}
</script>

</body>
</html>
